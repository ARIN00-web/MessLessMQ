apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: messlessmq
  namespace: messlessmq
  labels:
    app.kubernetes.io/name: messlessmq
spec:
  serviceName: messlessmq-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: messlessmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messlessmq
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: messlessmq:phase20
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 9092
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
            failureThreshold: 3
