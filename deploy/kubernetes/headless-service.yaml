apiVersion: v1
kind: Service
metadata:
  name: messlessmq-headless
  namespace: messlessmq
  labels:
    app.kubernetes.io/name: messlessmq
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: messlessmq
  ports:
    - name: client
      port: 9092
      targetPort: client
      protocol: TCP
    - name: peer
      port: 19093
      targetPort: peer
      protocol: TCP
    - name: admin
      port: 9093
      targetPort: admin
      protocol: TCP
